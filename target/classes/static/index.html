<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DB Viewer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #94a3b8; margin-top: 0; }
  .toggle { margin: 16px 0; }
  .toggle button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-right: 8px;
  }
  .toggle button.active { background: #3b82f6; border-color: #3b82f6; }
  ul { list-style: none; padding: 0; max-width: 400px; }
  li {
    background: #1e293b; margin: 6px 0; padding: 10px 14px;
    border-radius: 6px; border-left: 3px solid #3b82f6;
  }
  .error { color: #f87171; }
</style>
</head>
<body>
  <h1>MySQL Databases</h1>
  <p class="sub" id="count">Loading...</p>
  <div class="toggle">
    <button id="allBtn" class="active">All</button>
    <button id="userBtn">My databases only</button>
  </div>
  <ul id="dbList"></ul>

  <script>
    const listEl = document.getElementById('dbList');
    const countEl = document.getElementById('count');
    const allBtn = document.getElementById('allBtn');
    const userBtn = document.getElementById('userBtn');

    async function loadDatabases(endpoint) {
      listEl.innerHTML = '';
      countEl.textContent = 'Loading...';
      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        if (data.status === 'error') {
          countEl.innerHTML = `<span class="error">Error: ${data.message}</span>`;
          return;
        }
        countEl.textContent = `${data.count} database(s) found`;
        data.databases.forEach(db => {
          const li = document.createElement('li');
          li.textContent = db;
          listEl.appendChild(li);
        });
      } catch (err) {
        countEl.innerHTML = `<span class="error">Could not reach backend. Is it running?</span>`;
      }
    }

    allBtn.onclick = () => {
      allBtn.classList.add('active');
      userBtn.classList.remove('active');
      loadDatabases('/api/databases');
    };
    userBtn.onclick = () => {
      userBtn.classList.add('active');
      allBtn.classList.remove('active');
      loadDatabases('/api/databases/user');
    };

    loadDatabases('/api/databases');
  </script>
</body>
</html>
